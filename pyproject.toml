[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pairedrl"
version = "0.0.1"
description = "Paired rollouts (common random numbers) for group-relative RL of LLM agents in stochastic environments"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]
cloud = [
  "modal>=1.5,<2",
  "huggingface_hub>=0.30",
]
train = [
  "torch==2.13.0",
  "transformers==5.16.1",
  "trl==1.12.0",
  "vllm==0.27.1",
  "peft==0.20.0",
  "accelerate==1.14.0",
  "datasets==5.0.1",
  "flash-linear-attention==0.5.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
